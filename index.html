<title>Docket Tally</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1d1d1b;--mut:#6b675e;--b:#e2ddd0;--a:#d9822b;--ok:#2e7d4f;--bad:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#171614;--card:#22211e;--ink:#f1eee6;--mut:#a29d90;--b:#363430;--a:#f0a04b;--ok:#5cc88a;--bad:#ef7a6c}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:max(14px,env(safe-area-inset-top)) 14px 40px;max-width:560px;margin:0 auto}
h1{font-size:20px;margin:4px 0 12px;display:flex;justify-content:space-between;align-items:center}
input[type=date]{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--b);border-radius:10px;padding:6px 8px}
.scan{display:block;width:100%;padding:20px;font-size:20px;font-weight:700;border:0;border-radius:16px;background:var(--a);color:#1d1d1b;margin-bottom:10px;text-align:center;position:relative;overflow:hidden}
.fin{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:0;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--b);border-radius:14px;padding:12px}
.card .n{font-size:13px;color:var(--mut)}.card .t{font-size:26px;font-weight:700}.card .s{font-size:13px;color:var(--mut)}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--b)}
.row:last-child{border:0}.chip{font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;color:#111}
.row .v{margin-left:auto;font-weight:600}.row .tm{color:var(--mut);font-size:13px}
.x{background:none;border:0;color:var(--mut);font-size:16px;padding:4px 8px}
.btn{font:inherit;font-weight:600;padding:12px 14px;border-radius:12px;border:1px solid var(--b);background:var(--card);color:var(--ink);text-align:center;position:relative;overflow:hidden}
.btn.p{background:var(--ink);color:var(--bg);border:0}.wide{display:block;width:100%;margin-top:8px}
dialog{border:0;border-radius:18px;padding:16px;background:var(--card);color:var(--ink);width:min(92vw,520px)}
dialog::backdrop{background:rgba(0,0,0,.55)}
label.l{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input[type=number],select{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid var(--b);background:var(--bg);color:var(--ink)}
.msg{font-size:14px;margin:8px 0}.ok{color:var(--ok)}.bad{color:var(--bad)}
img.prev{width:100%;border-radius:10px;border:1px solid var(--b)}
.hint{color:var(--mut);font-size:13px;text-align:center;margin-top:16px}
details{font-size:12px;color:var(--mut);margin-top:6px}pre{white-space:pre-wrap;margin:4px 0}
</style></head><body>
<h1>Docket Tally <input type="date" id="day"></h1>
<label class="scan"><span id="stxt">📷 Scan docket</span><input class="fin" type="file" id="file" accept="image/*" capture="environment"></label>
<label class="btn wide" style="margin:0 0 10px"><span>🖼 Choose photo instead</span><input class="fin" type="file" id="file2" accept="image/*"></label>
<div class="msg" id="st"></div>
<div class="grid" id="cards"></div>
<div class="card tot"><span>Day total</span><b id="grand"></b></div>
<div class="card" id="list"></div>
<button class="btn p wide" id="mk">Make summary image</button>
<p class="hint">Dockets are saved on this phone only. The first scan downloads the text reader, so do it with signal.</p>

<dialog id="dlg"><b>Check docket</b><div class="msg" id="rd"></div>
<label class="l">Load type</label><select id="ty"></select>
<label class="l">Net weight (kg)</label><input type="number" id="nt" inputmode="numeric">
<div class="msg" id="chk"></div>
<details><summary>What it read</summary><pre id="raw"></pre></details>
<div style="display:flex;gap:8px;margin-top:10px"><button class="btn" id="cx" style="flex:1">Cancel</button><button class="btn p" id="sv" style="flex:2">Save load</button></div></dialog>

<dialog id="sd"><img class="prev" id="pv" alt="Summary"><button class="btn p wide" id="sh">Send / share</button><button class="btn wide" id="dl">Save image</button><button class="btn wide" id="sc">Close</button><div class="msg" id="sm"></div></dialog>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
window.onerror=m=>{document.getElementById('st').textContent='Error: '+m};
const TYPES=[{id:'c4',name:'20mm C4 CR',col:'#e9a05b'},{id:'rock',name:'Clean Rock',col:'#6bb6d9'}];
const KEY='docket-tally-v1',$=s=>document.getElementById(s);
let loads=[];try{loads=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(loads))}catch(e){}};
const ymd=d=>{const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())};
$('day').value=ymd(new Date());
const tn=kg=>(kg/1000).toFixed(2),kgf=n=>Number(n).toLocaleString('en-AU');
function classify(p){p=(p||'').toUpperCase();if(/CLEAN\s*R[O0]CK|DISP[O0]SAL/.test(p))return'rock';if(/\bC[4A]\b|20\s*MM|EXBIN/.test(p))return'c4';return''}

function render(){
  const d=$('day').value,L=loads.filter(l=>l.date===d);
  $('cards').innerHTML=TYPES.map(t=>{const m=L.filter(l=>l.type===t.id),s=m.reduce((a,l)=>a+l.net,0);
    return `<div class="card" style="border-top:4px solid ${t.col}"><div class="n">${t.name}</div><div class="t">${tn(s)} t</div><div class="s">${m.length} load${m.length==1?'':'s'} · ${kgf(s)} kg</div></div>`}).join('');
  const g=L.reduce((a,l)=>a+l.net,0);$('grand').textContent=`${tn(g)} t · ${L.length} loads`;
  $('list').innerHTML=L.length?L.slice().reverse().map(l=>{const t=TYPES.find(x=>x.id===l.type);
    return `<div class="row"><span class="chip" style="background:${t.col}">${t.name}</span><span class="tm">${new Date(l.ts).toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'})}</span><span class="v">${kgf(l.net)} kg</span><button class="x" data-id="${l.id}">✕</button></div>`}).join(''):'<span style="color:var(--mut)">No loads yet for this day.</span>';
}
$('list').onclick=e=>{const id=e.target.dataset.id;if(!id)return;
  if(e.target.dataset.arm!=='1'){e.target.dataset.arm='1';e.target.textContent='Delete?';return}
  loads=loads.filter(l=>String(l.id)!==id);save();render()};
$('day').onchange=render;
$('ty').innerHTML='<option value="">Choose type…</option>'+TYPES.map(t=>`<option value="${t.id}">${t.name}</option>`).join('');

function prep(f){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(f);
  im.onload=()=>{const r=Math.min(1,2000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);
    const x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);
    const d=x.getImageData(0,0,c.width,c.height),p=d.data;let s=0;
    for(let i=0;i<p.length;i+=4){p[i]=.3*p[i]+.59*p[i+1]+.11*p[i+2];s+=p[i]}
    const mean=s/(p.length/4);
    for(let i=0;i<p.length;i+=4){const g=Math.max(0,Math.min(255,(p[i]-mean)*1.5+mean+10));p[i]=p[i+1]=p[i+2]=g}
    x.putImageData(d,0,0);URL.revokeObjectURL(u);res(c)};
  im.onerror=()=>rej(new Error('Could not open photo'));im.src=u})}

let worker=null;
async function getWorker(){if(worker)return worker;
  worker=await Tesseract.createWorker('eng',1,{logger:m=>{if(m.status)$('st').textContent=(m.status==='recognizing text'?'Reading docket… ':'Loading reader… ')+(m.progress?Math.round(m.progress*100)+'%':'')}});
  return worker}

function parse(t){
  const num=s=>+s.replace(/[,.\s]/g,''),re=/(\d{1,3}(?:[,.\s]\d{3})+|\d{4,6})\s*k\s*g/i;
  let net=0,last=0;
  for(const line of t.split('\n')){const m=line.match(re);if(!m)continue;last=num(m[1]);if(/\bn[e3]t\b/i.test(line))net=last}
  return{net:net||last}}

async function onPick(e){
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const fi=$('file'),b=$('stxt');fi.disabled=true;b.textContent='Working…';$('st').textContent='Preparing photo…';
  let ok=false;
  try{
    const c=await prep(f),w=await getWorker(),r=await w.recognize(c),t=r.data.text||'',p=parse(t);
    $('raw').textContent=t;$('ty').value=classify(t);$('nt').value=p.net||'';
    $('rd').textContent=p.net?'Check the net against your docket.':'Couldn’t find a net weight. Enter it below.';
    ok=true;
  }catch(err){$('raw').textContent='';$('ty').value='';$('nt').value='';$('rd').innerHTML='<span class="bad">Couldn’t read that photo ('+(err.message||err)+'). Enter it by hand.</span>'}
  fi.disabled=false;b.textContent='📷 Scan docket';$('st').textContent='';
  $('dlg').showModal();
}
$('file').onchange=onPick;$('file2').onchange=onPick;
$('cx').onclick=()=>$('dlg').close();
$('sv').onclick=()=>{const n=Math.round(+$('nt').value),t=$('ty').value;
  if(!t||!n){$('chk').innerHTML='<span class="bad">Pick a load type and enter the net weight.</span>';return}
  loads.push({id:Date.now(),date:$('day').value,type:t,net:n,ts:Date.now()});save();$('chk').textContent='';$('dlg').close();render()};

function draw(){return new Promise(res=>{
  const d=$('day').value,L=loads.filter(l=>l.date===d),W=1080,H=640,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#1d1d1b';x.font='700 56px sans-serif';x.fillText('Daily Load Totals',60,100);
  x.fillStyle='#6b675e';x.font='34px sans-serif';x.fillText(new Date(d+'T00:00:00').toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long',year:'numeric'}),60,152);
  let y=200;
  TYPES.forEach(t=>{const m=L.filter(l=>l.type===t.id),s=m.reduce((a,l)=>a+l.net,0);
    x.fillStyle=t.col;x.fillRect(60,y,16,130);x.fillStyle='#1d1d1b';x.font='700 40px sans-serif';x.fillText(t.name,96,y+44);
    x.font='34px sans-serif';x.fillStyle='#6b675e';x.fillText(m.length+' load'+(m.length==1?'':'s')+' · '+kgf(s)+' kg',96,y+100);
    x.textAlign='right';x.fillStyle='#1d1d1b';x.font='700 64px sans-serif';x.fillText(tn(s)+' t',W-60,y+90);x.textAlign='left';y+=160});
  const g=L.reduce((a,l)=>a+l.net,0);
  x.fillStyle='#1d1d1b';x.fillRect(60,y+4,W-120,3);x.font='700 40px sans-serif';x.fillText('TOTAL · '+L.length+' loads',60,y+70);
  x.textAlign='right';x.font='700 64px sans-serif';x.fillText(tn(g)+' t',W-60,y+74);
  c.toBlob(res,'image/png')})}
let blob=null;const fname=()=>`loads-${$('day').value}.png`;
$('mk').onclick=async()=>{blob=await draw();$('pv').src=URL.createObjectURL(blob);$('sm').textContent='';$('sd').showModal()};
$('sc').onclick=()=>$('sd').close();
$('sh').onclick=async()=>{const f=new File([blob],fname(),{type:'image/png'});
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e.name==='AbortError')return}
  $('sm').textContent='Sharing isn’t available. Use Save image, or press and hold the picture.'};
$('dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname();document.body.appendChild(a);a.click();a.remove();$('sm').textContent='Saved to your downloads.'};
render();
</script></body></html>
